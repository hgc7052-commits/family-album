<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>우리 가족 앨범</title>
  <style>
:root {
  --bg: #fbf7f3; --card: #fff; --ink: #2a2420; --sub: #7a6f66;
  --line: #eadfd5; --acc: #c0562c; --acc-ink: #fff; --blue: #1f5fbf; --red: #d0312d;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17130f; --card: #241e19; --ink: #f3ece5; --sub: #a99d92;
    --line: #3a312a; --acc: #e0764a; --acc-ink: #1b120d; --blue: #6fa8ff; --red: #ff6b66;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }   /* hidden 속성이 .selbar·.row·.up 등의 display 설정에 가려지지 않도록 */
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
}
.wrap { max-width: 980px; margin: 0 auto; padding: 18px 16px 60px; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
h1 { font-size: 24px; margin: 0; }
h2 { font-size: 15px; color: var(--sub); margin: 22px 0 8px; }
.sub { color: var(--sub); font-size: 13px; }
button, input { font: inherit; color: inherit; }

.btn { background: var(--acc); color: var(--acc-ink); border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 700; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.danger { background: transparent; color: #c0362c; border: 1px solid var(--line); }
.btn:disabled { opacity: .5; cursor: default; }

.up { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 14px; display: grid; gap: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row input[type=text], .bar input { flex: 1; min-width: 140px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
.bar { margin-bottom: 12px; }
.bar input { width: 100%; background: var(--card); }
.prog { height: 6px; background: var(--line); border-radius: 6px; overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--acc); transition: width .2s; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
.chip { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; cursor: pointer; white-space: nowrap; }
.chip.on { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 6px; }
.th { aspect-ratio: 1; border: 0; padding: 0; border-radius: 8px; overflow: hidden; background: var(--line); cursor: pointer; }
.th img { width: 100%; height: 100%; object-fit: cover; display: block; }
.empty { background: var(--card); border: 1px dashed var(--line); border-radius: 14px; padding: 28px 18px; text-align: center; color: var(--sub); }

.lb { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; background: rgba(10, 8, 6, .92); }
.lb[hidden] { display: none; }
.lbtop { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; color: #fff; }
.lbtop button { background: rgba(255,255,255,.14); color: #fff; border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
.lbimg { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; }
.lbimg img { max-width: 100%; max-height: 100%; object-fit: contain; }
.nav { position: absolute; top: 50%; transform: translateY(-50%); width: 42px; height: 42px; border: 0; border-radius: 50%; background: rgba(255,255,255,.16); color: #fff; font-size: 20px; cursor: pointer; }
.nav.l { left: 10px; } .nav.r { right: 10px; }
.lbinfo { background: var(--card); padding: 12px 14px; display: grid; gap: 8px; }

/* 선택 삭제 */
.th { position: relative; }
.th.sel { outline: 3px solid var(--acc); outline-offset: -3px; }
.selbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }

/* 사진/버튼이 파랗게 칠해지는 현상 방지 (브라우저의 텍스트·이미지 선택 하이라이트 끄기) */
.lb, .grid, .th, .nav, .lbtop { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
.lb input { -webkit-user-select: text; user-select: text; }
.lb img, .th img { -webkit-user-drag: none; }
.lb img::selection, .th img::selection { background: transparent; }

/* 크게 보기의 찍은 날짜 입력 */
.lbinfo input[type=date] {
  padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color-scheme: light dark;
}
/* 년도 | 월 구분선, 사진 위 찍은 날짜 표시 */
.th .dt {
  position: absolute; top: 4px; left: 4px; padding: 1px 6px; border-radius: 6px;
  font-size: 11px; line-height: 1.4; color: #fff; background: rgba(0, 0, 0, .55); pointer-events: none;
}

/* 사진별 주석(20자 이내) - 썸네일 아래쪽에 표시 */
.th .note {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 6px 4px;
  font-size: 11px; line-height: 1.3; color: #fff; text-align: left;
  background: linear-gradient(transparent, rgba(0, 0, 0, .65));
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; pointer-events: none;
}

/* 년도/월별 페이지 */
.chip.yr { font-weight: 700; }
.pghead { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 6px 0 12px; display: grid; gap: 8px; }
.pgtop { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.pgym { font-size: 22px; font-weight: 800; color: var(--acc); }
.pgnav { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pgnav .btn { padding: 6px 12px; }
.pgtitle { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 17px; font-weight: 700; }
.pgstat { min-height: 1.4em; }

/* 일부 선택(범위) / 선택 앨범변경 */
#selHelp { margin-bottom: 8px; }
.albbox { margin-bottom: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; }
.albbox .chg { display: inline-flex; gap: 6px; align-items: center; min-width: 92px; font-size: 14px; }
.albbox input[type=text]:disabled { opacity: .5; }

/* 선택 모드: 모든 사진에 동그라미 표시, 선택하면 ✓ */
.th .ck {
  position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 50%;
  border: 2px solid #fff; background: rgba(0, 0, 0, .35); box-shadow: 0 0 0 1px rgba(0, 0, 0, .25); pointer-events: none;
}
.th.sel .ck { background: var(--acc); border-color: var(--acc-ink); }
.th.sel .ck::after { content: "✓"; position: absolute; inset: 0; color: var(--acc-ink); font-size: 15px; line-height: 20px; font-weight: 700; text-align: center; }
/* 손가락으로 끌어서 선택 중에는 화면이 스크롤되지 않게 */
main.paint .grid { touch-action: none; }

/* 슬라이드쇼 */
.up select { font: inherit; color: inherit; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
.up label.sub { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; }
.show { position: fixed; inset: 0; z-index: 40; background: #000; color: #fff; overflow: hidden; -webkit-user-select: none; user-select: none; }
.shimg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 2vw; opacity: 0; transition: opacity .8s ease; }
.shimg img { display: block; -webkit-user-drag: none; }
.shimg img.big { width: 100%; height: 100%; object-fit: contain; }
.shimg img.small { box-shadow: 0 4px 24px rgba(0, 0, 0, .6); border-radius: 4px; }
.shimg.on { opacity: 1; }
.shprog { position: absolute; top: 0; left: 0; right: 0; height: 3px; background: rgba(255, 255, 255, .15); z-index: 3; }
.shprog i { display: block; height: 100%; width: 0; background: var(--acc); }
.shcap { position: absolute; left: 0; right: 0; bottom: 0; padding: 56px 24px 84px; z-index: 2; pointer-events: none;
  background: linear-gradient(transparent, rgba(0, 0, 0, .72)); text-shadow: 0 1px 3px rgba(0, 0, 0, .6); }
.shcap b { font-size: 22px; }
.shcap div { font-size: 17px; opacity: .92; margin-top: 2px; }
.shctl { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 4; display: flex; gap: 8px; align-items: center;
  background: rgba(20, 16, 12, .78); padding: 8px 12px; border-radius: 999px; transition: opacity .3s; }
.shctl button { background: rgba(255, 255, 255, .15); color: #fff; border: 0; border-radius: 999px; min-width: 42px; height: 42px; padding: 0 14px; font-size: 18px; cursor: pointer; }
.shctl span { font-size: 13px; padding: 0 6px; white-space: nowrap; }
.shend { position: absolute; inset: 0; z-index: 3; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-size: 28px; text-align: center; }
.shend small { font-size: 15px; opacity: .7; }
.show.idle { cursor: none; }
.show.idle .shctl { opacity: 0; pointer-events: none; }

/* 앨범·년도·월: 각각 한 줄씩, 많으면 줄바꿈해서 모두 보이게 */
.chips.wrap { flex-wrap: wrap; overflow-x: visible; padding: 0 0 2px; margin: 0 0 6px; max-width: none; }
.chiplbl { flex: none; align-self: center; min-width: 160px; font-size: 19.5px; font-weight: 700; color: var(--blue); white-space: nowrap; }
.chiplbl .cnt { color: var(--ink); }
@media (max-width: 600px) { .chiplbl { min-width: 0; margin-right: 4px; font-size: 16px; } }
/* 년도·월: 한 줄, 버튼 크기 일정 (화면이 아주 좁으면 옆으로 밀어서 보기) */
.chips.one { flex-wrap: nowrap; overflow-x: auto; gap: 4px; padding-bottom: 2px; margin-bottom: 6px; }
.chips.one .chip { flex: none; text-align: center; padding: 6px 0; white-space: nowrap; }
.chips.one .chip.yr { width: 62px; font-size: 14px; }
.chips.one#yearChips { overflow: visible; align-items: center; }
.yscroll { flex: 1; min-width: 0; display: flex; gap: 4px; overflow-x: auto; position: relative; padding-bottom: 4px; scrollbar-width: thin; }
.yscroll::-webkit-scrollbar { height: 6px; }
.yscroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }
.chips.one .chip.yr.yc { width: 92px; color: var(--ink); }
.chips.one .chip.yr.yc .cnt { color: var(--ink); }
.chips.one .chip.yr.yc.on { background: #fde3d6; border: 2px solid var(--acc); color: #000; }
.chips.one .chip.yr.yc.on .cnt { color: #000; }
.yarrow { flex: none; width: 30px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); font-size: 18px; cursor: pointer; }
.yarrow:disabled { opacity: .35; cursor: default; }
.chips.one select.chip.more { width: 62px; font-size: 14px; color: var(--sub); text-align: center; appearance: none; -webkit-appearance: none; }
.chips.one .chip.mo { width: var(--mw, 58px); font-size: 14px; color: var(--ink); }
.chips.one .chip.mo .cnt { color: var(--ink); }
.chips.one .chip.mo.on { background: #fde3d6; border: 2px solid var(--acc); color: #000; font-weight: 700; }
.chips.one .chip.mo.on .cnt { color: #000; }
.chips.one .chip.mo:disabled { opacity: .4; cursor: default; }

/* 사진 페이지 이동 (한 화면에 N장씩) */
/* 머리말 묶음 버튼 (사진백업 ▾ / 보기 ▾) */
.menu { position: relative; }
.mlist { position: absolute; top: calc(100% + 4px); left: 0; z-index: 15; min-width: 100%; display: grid; padding: 4px;
  background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 20px rgba(0, 0, 0, .15); }
.mlist button { border: 0; background: transparent; text-align: left; padding: 9px 14px; border-radius: 8px; font-weight: 700; white-space: nowrap; cursor: pointer; }
.mlist button:hover { background: var(--bg); }
.mlist button:disabled { opacity: .45; cursor: default; }
.pager { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0; }
.pager button { min-width: 38px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); cursor: pointer; }
.pager button.on { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); font-weight: 700; cursor: default; }
.pager button:disabled { opacity: .45; cursor: default; }
.pager .psize { margin-left: auto; display: inline-flex; gap: 6px; align-items: center; }
.pager select { font: inherit; color: inherit; padding: 5px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>우리 가족 앨범</h1>
        <div class="sub" id="count">불러오는 중…</div>
      </div>
      <div class="row">
        <div class="menu">
          <button class="btn ghost mbtn">사진백업 ▾</button>
          <div class="mlist" hidden>
            <button id="bkDir" title="고른 폴더에 앨범별로 JPG 저장 (크롬·엣지)">폴더</button>
            <button id="bkZip" title="앨범별 폴더에 JPG를 담은 ZIP 파일로 저장">ZIP</button>
          </div>
        </div>
        <div class="menu">
          <button class="btn ghost mbtn">보기 ▾</button>
          <div class="mlist" hidden>
            <button id="expAll" title="다른 PC로 옮기기: 사진·앨범·날짜·주석·설명·달 제목을 모두 담아요">내보내기</button>
            <button id="impAll" title="내보내기로 만든 파일을 불러와요">가져오기</button>
          </div>
        </div>
        <input type="file" id="impFile" accept=".zip" multiple hidden>
        <button class="btn ghost" id="selMode">선택</button>
        <button class="btn ghost" id="openShow">슬라이드쇼</button>
        <button class="btn" id="openUp">사진 올리기</button>
      </div>
    </header>

    <div class="selbar" id="selBar" hidden>
      <button class="btn ghost" id="selAll">이 달 사진 전체 선택</button>
      <button class="btn ghost" id="selPart">이 달 사진 일부 선택</button>
      <button class="btn ghost" id="selNone" disabled>선택 모두 취소</button>
      <button class="btn ghost" id="selAlb" disabled>선택 앨범·제목변경 (0)</button>
      <button class="btn ghost" id="selRot" disabled>선택 오른쪽으로 돌리기 ⟳ (0)</button>
      <button class="btn danger" id="delSel" disabled>선택 삭제 (0)</button>
    </div>
    <div class="sub" id="selHelp" hidden></div>
    <div class="albbox" id="albBox" hidden>
      <div class="row">
        <label class="sub chg"><input type="checkbox" id="albOn" checked> 앨범 변경</label>
        <input type="text" id="albNew" list="albums" placeholder="옮길 앨범 이름 (비우면 앨범 없음)">
      </div>
      <div class="row">
        <label class="sub chg"><input type="checkbox" id="capOn"> 제목 변경</label>
        <input type="text" id="capNew" placeholder="새 제목(사진 설명) (비우면 제목 없음)" disabled>
      </div>
      <div class="row">
        <button class="btn" id="albGo">변경</button>
        <button class="btn ghost" id="albCancel">취소</button>
        <span class="sub" id="albHint"></span>
      </div>
    </div>

    <div class="sub bkmsg" id="bkMsg" hidden></div>

    <section class="up" id="upBox" hidden>
      <input type="file" id="file" accept="image/*" multiple>
      <div class="row">
        <input type="text" id="album" list="albums" placeholder="앨범 이름 (예: 2026 제주 여행)">
        <datalist id="albums"></datalist>
        <button class="btn" id="go" disabled>업로드</button>
        <button class="btn ghost" id="cancel">닫기</button>
      </div>
      <div class="prog" id="prog" hidden><i></i></div>
      <div class="sub" id="upMsg">큰 사진은 화면용으로 자동으로 줄여서 저장돼요. 찍은 날짜는 "찍은 날짜" → 파일 이름의 날짜 → "수정한 날짜" 순서로 자동 기록돼요.</div>
    </section>

    <section class="up" id="showBox" hidden>
      <div class="row">
        <label class="sub">범위
          <select id="shRange">
            <option value="page">이 달 사진</option>
            <option value="all">전체 (선택한 앨범·검색 결과)</option>
          </select>
        </label>
        <label class="sub">간격
          <select id="shSec">
            <option value="1">1초</option>
            <option value="2">2초</option>
            <option value="3">3초</option>
            <option value="5" selected>5초</option>
            <option value="10">10초</option>
          </select>
        </label>
        <label class="sub">순서
          <select id="shOrder">
            <option value="old">오래된 날짜부터</option>
            <option value="new">최근 날짜부터</option>
            <option value="shuffle">섞어서</option>
          </select>
        </label>
        <label class="sub"><input type="checkbox" id="shLoop" checked> 반복 재생</label>
      </div>
      <div class="row">
        <button class="btn" id="shGo">▶ 슬라이드쇼 시작</button>
        <button class="btn ghost" id="shCancel">닫기</button>
      </div>
      <div class="sub" id="shMsg"></div>
    </section>

    <div class="chips wrap" id="chips"></div>
    <div class="bar">
      <input type="search" id="q" placeholder="설명·주석·앨범으로 검색">
    </div>
    <div class="chips one" id="yearChips"></div>
    <div class="chips one" id="monthChips"></div>
    <main id="main"></main>
  </div>

  <div class="lb" id="lb" hidden>
    <div class="lbtop">
      <span id="lbPos"></span>
      <button id="lbClose">닫기 ✕</button>
    </div>
    <div class="lbimg">
      <button class="nav l" id="prev" aria-label="이전">‹</button>
      <img id="lbImg" alt="" draggable="false">
      <button class="nav r" id="next" aria-label="다음">›</button>
    </div>
    <div class="lbinfo">
      <div class="sub" id="lbDate"></div>
      <div class="row">
        <input type="text" id="lbNote" maxlength="20" placeholder="주석 (20자 이내)">
        <span class="sub" id="lbNoteCnt">0/20</span>
      </div>
      <div class="row">
        <span class="sub">찍은 날짜(수정 가능)</span>
        <input type="date" id="lbTaken" aria-label="촬영일">
      </div>
      <div class="row">
        <input type="text" id="lbCap" placeholder="사진 설명">
        <input type="text" id="lbAlb" list="albums" placeholder="앨범">
      </div>
      <div class="row">
        <button class="btn ghost" id="rotL" title="왼쪽으로 90° 돌리기">⟲ 왼쪽으로</button>
        <button class="btn ghost" id="rotR" title="오른쪽으로 90° 돌리기">⟳ 오른쪽으로</button>
        <button class="btn" id="save">저장</button>
        <button class="btn ghost" id="dl">원본 받기</button>
        <button class="btn danger" id="del">삭제</button>
      </div>
    </div>
  </div>

  <div class="show" id="show" hidden>
    <div class="shprog"><i id="shBar"></i></div>
    <div class="shimg" id="shA"></div>
    <div class="shimg" id="shB"></div>
    <div class="shcap" id="shCap"></div>
    <div class="shend" id="shEnd" hidden>슬라이드쇼가 끝났어요<small>클릭하거나 Esc를 눌러 종료</small></div>
    <div class="shctl" id="shCtl">
      <button id="shPrev" aria-label="이전">‹</button>
      <button id="shPlay" aria-label="재생/일시정지">⏸</button>
      <button id="shNext" aria-label="다음">›</button>
      <button id="shSpd" title="넘어가는 간격">5초</button>
      <span id="shPos"></span>
      <button id="shClose" aria-label="종료">✕ 종료</button>
    </div>
  </div>

  <script>
// 우리 가족 앨범 - 사진은 이 브라우저의 IndexedDB에 저장됩니다.
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  let photos = [];      // 저장된 사진 목록
  let view = [];        // 현재 화면에 보이는 목록
  let album = '', query = '', cur = -1;
  let titles = {}, pageKey = '', datesMap = {};            // 년-월 페이지 제목 / 현재 페이지(예: '2026-11')
  let selecting = false;
  const PAGE_SIZES = [12, 24, 48, 96];
  let photoPage = 0, pageSize = 24;   // 한 달 안에서의 사진 페이지(0부터) / 한 화면에 보이는 장수
  try { const v = Number(localStorage.getItem('album-pagesize')); if (PAGE_SIZES.includes(v)) pageSize = v; } catch (e) { /* 저장값 없음 */ }
  const urlCache = new Map();   // 사진 주소는 화면에 필요할 때만 만들어서 시작을 빠르게
  function srcOf(p, kind) {
    const k = p.id + kind; let u = urlCache.get(k);
    if (!u) { u = URL.createObjectURL(kind === 'thumb' ? p.thumb : p.blob); urlCache.set(k, u); }
    return u;
  }
  const thumbSrc = (p) => srcOf(p, 'thumb'), fullSrc = (p) => srcOf(p, 'blob');
  let filteredAll = [];   // 앨범·검색 조건에 맞는 전체 사진(슬라이드쇼 '전체' 범위용)
  let paintOn = false, lastPickId = null, suppressClick = false;   // 손가락 끌어서 선택 켜기 / 마지막으로 누른 사진 / 끌기 직후 클릭 무시
  const sel = new Set();   // 선택된 사진 id

  // ---------- IndexedDB ----------
  let dbp;
  function openDB() {
    if (dbp) return dbp;
    dbp = new Promise((resolve, reject) => {
      const req = indexedDB.open('family-album', 3);
      req.onupgradeneeded = () => {
        const db = req.result;   // 기존 사진 데이터는 그대로 두고 제목·찍은 날짜 저장소만 추가
        if (!db.objectStoreNames.contains('photos')) db.createObjectStore('photos', { keyPath: 'id', autoIncrement: true });
        if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'key' });
        if (!db.objectStoreNames.contains('dates')) db.createObjectStore('dates', { keyPath: 'id' });   // 사진별 찍은 날짜 기록
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbp;
  }
  async function tx(mode, fn, store = 'photos') {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const t = db.transaction(store, mode);
      const r = fn(t.objectStore(store));
      t.oncomplete = () => resolve(r && r.result);
      t.onerror = () => reject(t.error);
    });
  }
  const getAll = () => tx('readonly', (s) => s.getAll());
  // 사진과 '찍은 날짜' 기록은 한 번에 저장합니다. (둘 다 성공하거나 둘 다 취소)
  function txBoth(fn) {
    return openDB().then((db) => new Promise((resolve, reject) => {
      const t = db.transaction(['photos', 'dates'], 'readwrite');
      const r = fn(t.objectStore('photos'), t.objectStore('dates'));
      t.oncomplete = () => resolve(r && r.result);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error);
    }));
  }
  const addPhoto = (p, d) => txBoth((ps, ds) => { const rq = ps.add(p); rq.onsuccess = () => ds.put({ ...d, id: rq.result }); return rq; });
  const putPhoto = (p, d) => txBoth((ps, ds) => { ps.put(p); if (d) ds.put(d); });
  const delPhoto = (id) => txBoth((ps, ds) => { ps.delete(id); ds.delete(id); });
  const getDates = () => tx('readonly', (s) => s.getAll(), 'dates');
  const putDates = (list) => tx('readwrite', (s) => { list.forEach((d) => s.put(d)); }, 'dates');
  const getMeta = () => tx('readonly', (s) => s.getAll(), 'meta');
  const putMeta = (m) => tx('readwrite', (s) => s.put(m), 'meta');
  const delMeta = (k) => tx('readwrite', (s) => s.delete(k), 'meta');

  async function load() {
    urlCache.forEach((u) => URL.revokeObjectURL(u)); urlCache.clear();
    photos = await getAll();
    titles = {};
    (await getMeta()).forEach((m) => { titles[m.key] = m.title; });
    // 찍은 날짜 DB와 맞추기: DB 값을 기준으로 쓰고, 기록이 없는 기존 사진은 지금 값으로 채워 넣음
    datesMap = {};
    (await getDates()).forEach((d) => { datesMap[d.id] = d; });
    const missing = [];
    photos.forEach((p) => {
      const d = datesMap[p.id];
      if (d) p.takenAt = d.takenAt;
      else {
        const nd = { id: p.id, takenAt: p.takenAt, source: 'legacy', fileName: '', fileModified: 0, uploadedAt: p.createdAt || 0, editedAt: 0 };
        datesMap[p.id] = nd; missing.push(nd);
      }
    });
    if (missing.length) await putDates(missing);
    render();
  }

  // ---------- 화면 그리기 (년도/월별 페이지) ----------
  const ymKey = (ts) => { const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
  function goPage(key) {
    pageKey = key; photoPage = 0; sel.clear(); updateSel(); resetPick();
    render(); window.scrollTo({ top: 0 });
  }
  function chipBtn(text, on, fn, extra) {
    const b = document.createElement('button');
    b.className = 'chip' + (on ? ' on' : '') + (extra ? ' ' + extra : '');
    b.textContent = text; b.onclick = fn;
    return b;
  }

  const MONTH_MIN = 58;   // 월 버튼 최소 너비(px)
  let yScroll = 0;        // 년도 줄 스크롤 위치(다시 그려도 유지)
  let rsT; window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => { if (photos.length) render(); }, 200); });
  const lbl = (t) => { const s = document.createElement('span'); s.className = 'chiplbl'; s.textContent = t; return s; };
  function pageNums(cur, total) {   // 예: 1 … 4 5 [6] 7 8 … 20
    const arr = [...new Set([0, total - 1, cur - 2, cur - 1, cur, cur + 1, cur + 2])].filter((n) => n >= 0 && n < total).sort((a, b) => a - b);
    const out = [];
    arr.forEach((n, i) => { if (i && n - arr[i - 1] > 1) out.push('…'); out.push(n); });
    return out;
  }

  function render() {
    const albums = [...new Set(photos.map((p) => p.album).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ko'));   // 가나다 순
    $('albums').replaceChildren(...albums.map((a) => Object.assign(document.createElement('option'), { value: a })));
    $('chips').replaceChildren(lbl('앨범'), ...['', ...albums].map((a) => chipBtn(a || '전체', a === album, () => { album = a; photoPage = 0; render(); })));

    const q = query.trim().toLowerCase();
    const filtered = photos
      .filter((p) => (!album || p.album === album) &&
        (!q || ((p.caption || '') + ' ' + (p.note || '') + ' ' + (p.album || '')).toLowerCase().includes(q)))
      .sort((a, b) => b.takenAt - a.takenAt);

    // 촬영일의 년-월 별로 나누기
    const groups = new Map();
    filtered.forEach((p) => { const k = ymKey(p.takenAt); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(p); });
    const keys = [...groups.keys()].sort();                         // 오래된 달 → 최근 달
    const ALL = pageKey === 'all';   // 'all' = 선택한 앨범(검색 결과) 전체 보기
    if (!ALL && !groups.has(pageKey)) {   // 보던 달에 사진이 없으면(앨범을 바꾸거나 사진을 옮긴 경우): 같은 년도 안에서 찾기
      const y = pageKey.slice(0, 4), sameY = keys.filter((k) => k.startsWith(y));
      if (!pageKey || !keys.length) pageKey = keys[keys.length - 1] || '';
      else if (sameY.length) {   // 같은 년도에서 가장 가까운 달
        const m = Number(pageKey.slice(5)), d = (k) => Math.abs(Number(k.slice(5)) - m);
        pageKey = sameY.reduce((b, k) => (d(k) <= d(b) ? k : b));
      } else {                   // 그 년도에 사진이 없으면 가장 가까운 년도의 마지막 달
        const yd = (k) => Math.abs(Number(k.slice(0, 4)) - Number(y));
        pageKey = keys.reduce((b, k) => (yd(k) <= yd(b) ? k : b));
      }
      photoPage = 0;
    }
    view = ALL ? filtered : (groups.get(pageKey) || []);
    // 지금 보는 범위에 맞게 버튼 이름 바꾸기 (이 달 / 전체)
    const scope = ALL ? '보이는' : '이 달';
    $('selAll').textContent = scope + ' 사진 전체 선택';
    if (!paintOn) $('selPart').textContent = scope + ' 사진 일부 선택';
    $('shRange').options[0].textContent = ALL ? '보이는 사진 전체' : '이 달 사진';
    filteredAll = filtered;
    $('count').textContent = '사진 ' + photos.length + '장' + (album || q ? ' · 보이는 사진 ' + filtered.length + '장' : '');

    const main = $('main'), yc = $('yearChips'), mc = $('monthChips');
    main.replaceChildren(); yc.replaceChildren(); mc.replaceChildren();
    if (!keys.length) {
      const d = document.createElement('div');
      d.className = 'empty';
      d.textContent = photos.length ? '조건에 맞는 사진이 없어요.' : '아직 사진이 없어요. 첫 사진을 올려 보세요!';
      main.append(d);
      return;
    }

    // 년도 한 줄 / 월 한 줄 (버튼 크기는 항상 같게)
    const curY = ALL ? '' : pageKey.slice(0, 4), GAP = 4;
    const yl = lbl('년도(');
    yl.append(Object.assign(document.createElement('span'), { className: 'cnt', textContent: '사진장수' }), ')');
    yc.append(yl);
    const allC = chipBtn('전체', ALL, () => goPage('all'), 'yr');   // 모든 년도를 한 화면에서 보기
    allC.title = (album ? '「' + album + '」 앨범 ' : '') + '전체 ' + filtered.length + '장 보기'; yc.append(allC);
    const years = [...new Set(keys.map((k) => k.slice(0, 4)))].reverse();   // 최근 년도부터
    const goYear = (y) => { const ks = keys.filter((k) => k.startsWith(y)); goPage(ks[ks.length - 1]); };
    // 년도 버튼: "2026(1234)" 형태, 옆으로 스크롤(마우스 휠·‹ › 버튼·끌기)해서 확인하고 선택
    const ysc = document.createElement('div'); ysc.className = 'yscroll';
    years.forEach((y) => {
      const n = keys.filter((k) => k.startsWith(y)).reduce((s, k) => s + groups.get(k).length, 0);
      const c = chipBtn('', y === curY, () => goYear(y), 'yr yc');
      c.append(y + '(', Object.assign(document.createElement('span'), { className: 'cnt', textContent: n }), ')');
      c.title = y + '년 · ' + n + '장'; ysc.append(c);
    });
    const arrow = (t, dir) => {
      const b = document.createElement('button'); b.className = 'yarrow'; b.textContent = t; b.title = dir < 0 ? '최근 년도 쪽으로' : '오래된 년도 쪽으로';
      b.onclick = () => ysc.scrollBy({ left: dir * ysc.clientWidth * 0.8, behavior: 'smooth' });
      return b;
    };
    const yPrev = arrow('‹', -1), yNext = arrow('›', 1);
    yc.append(yPrev, ysc, yNext);
    const yArrows = () => {
      const can = ysc.scrollWidth > ysc.clientWidth + 1;
      yPrev.hidden = yNext.hidden = !can;
      yPrev.disabled = ysc.scrollLeft <= 0;
      yNext.disabled = ysc.scrollLeft + ysc.clientWidth >= ysc.scrollWidth - 1;
    };
    ysc.addEventListener('scroll', () => { yScroll = ysc.scrollLeft; yArrows(); });
    ysc.addEventListener('wheel', (e) => {   // 마우스 휠을 위아래로 굴리면 년도가 옆으로 넘어감
      if (ysc.scrollWidth <= ysc.clientWidth || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
      ysc.scrollLeft += e.deltaY; e.preventDefault();
    }, { passive: false });
    ysc.scrollLeft = yScroll;
    const on = ysc.querySelector('.chip.on');   // 지금 보는 년도가 안 보이면 가운데로
    if (on && (on.offsetLeft < ysc.scrollLeft || on.offsetLeft + on.offsetWidth > ysc.scrollLeft + ysc.clientWidth)) {
      ysc.scrollLeft = on.offsetLeft - (ysc.clientWidth - on.offsetWidth) / 2; yScroll = ysc.scrollLeft;
    }
    yArrows();
    // 월 줄: 12달 모두 표시 (사진 없는 달은 흐리게)
    const ml = lbl('월(');
    ml.append(Object.assign(document.createElement('span'), { className: 'cnt', textContent: '사진장수' }), ')');
    mc.append(ml);
    if (ALL) {
      const s = document.createElement('span'); s.className = 'sub'; s.style.alignSelf = 'center';
      s.textContent = '전체 보기 중이에요. 년도를 누르면 달별로 볼 수 있어요.';
      mc.append(s);
    } else {
    const mAvail = mc.clientWidth - ml.offsetWidth - GAP;
    mc.style.setProperty('--mw', Math.max(MONTH_MIN, Math.floor((mAvail + GAP) / 12 - GAP)) + 'px');
    for (let m = 12; m >= 1; m--) {
      const k = curY + '-' + String(m).padStart(2, '0'), n = groups.has(k) ? groups.get(k).length : 0;
      const c = chipBtn('', k === pageKey, () => goPage(k), 'mo');
      c.append(m + '(', Object.assign(document.createElement('span'), { className: 'cnt', textContent: n }), ')');
      c.title = m + '월 · ' + n + '장' + (titles[k] ? ' · ' + titles[k] : '');
      if (!n) c.disabled = true;
      mc.append(c);
    }
    }

    // 페이지 상단: 년도 · 월 · 제목
    const key = pageKey, pi = keys.indexOf(key);
    const head = document.createElement('div'); head.className = 'pghead';
    const top = document.createElement('div'); top.className = 'pgtop';
    const ym = document.createElement('div'); ym.className = 'pgym';
    ym.textContent = ALL ? (album ? '「' + album + '」 앨범 ' : '') + '전체' : Number(key.slice(0, 4)) + '년 ' + Number(key.slice(5)) + '월';
    const nav = document.createElement('div'); nav.className = 'pgnav';
    const info = document.createElement('span'); info.className = 'sub';
    info.textContent = ALL ? years.length + '개 년도 · ' + keys.length + '개 달 · ' + view.length + '장 (최근 사진부터)'
                           : (pi + 1) + ' / ' + keys.length + '번째 달 · ' + view.length + '장';
    const mk = (text, k) => {
      const b = document.createElement('button');
      b.className = 'btn ghost'; b.textContent = text; b.disabled = !k;
      if (k) b.onclick = () => goPage(k);
      return b;
    };
    if (ALL) nav.append(info); else nav.append(info, mk('‹ 이전 달', keys[pi - 1]), mk('다음 달 ›', keys[pi + 1]));
    top.append(ym, nav);

    // 사진 페이지 이동: 한 화면에 pageSize장씩만 그려서 빠르게
    const pages = Math.max(1, Math.ceil(view.length / pageSize));
    if (photoPage >= pages) photoPage = pages - 1;
    const start = photoPage * pageSize;
    const goPhotoPage = (n) => { photoPage = n; render(); window.scrollTo({ top: 0 }); };
    const makePager = (withSize) => {
      const bar = document.createElement('div'); bar.className = 'pager';
      const nb = (text, n, on, dis) => {
        const b = document.createElement('button'); b.textContent = text; b.disabled = !!dis;
        if (on) b.className = 'on'; else if (!dis) b.onclick = () => goPhotoPage(n);
        return b;
      };
      bar.append(nb('‹ 이전', photoPage - 1, false, photoPage === 0));
      pageNums(photoPage, pages).forEach((n) => {
        if (n === '…') { const e = document.createElement('span'); e.className = 'sub'; e.textContent = '…'; bar.append(e); }
        else bar.append(nb(String(n + 1), n, n === photoPage));
      });
      bar.append(nb('다음 ›', photoPage + 1, false, photoPage >= pages - 1));
      const inf = document.createElement('span'); inf.className = 'sub';
      inf.textContent = view.length ? (start + 1) + '–' + Math.min(start + pageSize, view.length) + ' / ' + view.length + '장' : '';
      bar.append(inf);
      if (withSize) {
        const L = document.createElement('label'); L.className = 'sub psize'; L.append('한 화면에 ');
        const sl = document.createElement('select');
        PAGE_SIZES.forEach((n) => { const o = document.createElement('option'); o.value = n; o.textContent = n + '장'; if (n === pageSize) o.selected = true; sl.append(o); });
        sl.onchange = () => {
          pageSize = Number(sl.value); photoPage = 0;
          try { localStorage.setItem('album-pagesize', String(pageSize)); } catch (e) { /* 저장 불가 */ }
          render();
        };
        L.append(sl); bar.append(L);
      }
      return bar;
    };
    head.append(top, makePager(true));

    const grid = document.createElement('div'); grid.className = 'grid';
    main.append(head, grid);
    view.slice(start, start + pageSize).forEach((p, j) => {
      const i = start + j;   // 이 달 전체 목록에서의 순서
      const b = document.createElement('button');
      b.className = 'th' + (sel.has(p.id) ? ' sel' : '');
      b.dataset.id = p.id;
      const img = document.createElement('img');
      img.src = thumbSrc(p); img.loading = 'lazy'; img.decoding = 'async'; img.alt = p.caption || '가족 사진';
      b.append(img);
      const dt = document.createElement('span');   // 사진 위에 찍은 날짜 표시
      dt.className = 'dt'; dt.textContent = fmtDate(p.takenAt);
      b.append(dt);
      if (p.note) {
        const n = document.createElement('span');
        n.className = 'note'; n.textContent = p.note;
        b.append(n);
      }
      if (selecting) {   // 선택 모드: 모든 사진에 동그라미 표시
        const ck = document.createElement('span'); ck.className = 'ck'; b.append(ck);
      }
      b.onclick = (ev) => {
        if (!selecting) return openLb(i);
        if (suppressClick) return;                      // 끌어서 선택한 직후의 클릭은 무시
        if (ev && ev.shiftKey && lastPickId !== null) {  // Shift+클릭: 지난번 사진부터 여기까지 범위 선택
          const a = view.findIndex((x) => x.id === lastPickId);
          if (a >= 0) { for (let k = Math.min(a, i); k <= Math.max(a, i); k++) paint(view[k].id, 'add'); }
        } else {                                         // 누르면 선택, 다시 누르면 취소
          paint(p.id, sel.has(p.id) ? 'remove' : 'add');
        }
        lastPickId = p.id; updateSel();
      };
      grid.append(b);
    });
  }

  // ---------- 크게 보기 ----------
  function openLb(i) {
    if (i < 0 || i >= view.length) return;
    cur = i;
    if (window.getSelection) window.getSelection().removeAllRanges();   // 남아 있는 선택 영역 제거
    const p = view[i], d = new Date(p.takenAt);
    $('lb').hidden = false;
    $('lbImg').src = fullSrc(p);
    $('lbPos').textContent = (i + 1) + ' / ' + view.length;
    const dr = datesMap[p.id];
    $('lbDate').textContent = '찍은 날짜 ' + fmtDate(p.takenAt) + (dr && SRC[dr.source] ? ' · 출처 ' + SRC[dr.source] : '') + (p.album ? ' · ' + p.album : '');
    $('lbCap').value = p.caption || '';
    $('lbNote').value = p.note || '';
    $('lbNoteCnt').textContent = [...(p.note || '')].length + '/20';
    $('lbTaken').value = dateVal(p.takenAt);
    $('lbAlb').value = p.album || '';
  }
  // 빠르게 연속 클릭(더블클릭)할 때 사진이 선택되어 파랗게 보이는 것을 막음
  $('lb').addEventListener('mousedown', (e) => { if (e.detail > 1 && e.target.tagName !== 'INPUT') e.preventDefault(); });
  const closeLb = (sync = true) => {   // 닫을 때, 보던 사진이 있는 사진 페이지로 목록을 맞춤
    $('lb').hidden = true;
    const at = cur; cur = -1;
    if (sync !== false && at >= 0 && Math.floor(at / pageSize) !== photoPage) { photoPage = Math.floor(at / pageSize); render(); }
  };
  const step = (n) => openLb((cur + n + view.length) % view.length);

  $('lbClose').onclick = closeLb;
  $('prev').onclick = () => step(-1);
  $('next').onclick = () => step(1);
  document.addEventListener('keydown', (e) => {
    if ($('lb').hidden) return;
    if (e.target.tagName === 'INPUT' && e.key !== 'Escape') return;   // 입력 중 방향키로 사진이 넘어가지 않게
    if (e.key === 'Escape') closeLb();
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });
  let startX = null;
  $('lbImg').addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; }, { passive: true });
  $('lbImg').addEventListener('touchend', (e) => {
    if (startX === null) return;
    const dx = e.changedTouches[0].clientX - startX; startX = null;
    if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);

  async function backupToFolder() {

      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
      ch.setUint16(12, dt, true); ch.setUint16(14, dd, true); ch.setUint32(16, crc, true);
      ch.setUint32(20, size, true); ch.setUint32(24, size, true); ch.setUint16(28, name.length, true);

  async function readZip(file) {
    const tailLen = Math.min(file.size, 65557);

    let e = -1;
    for (let i = tailLen - 22; i >= 0; i--) if (tail.getUint32(i, true) === 0x06054b50) { e = i; break; }

    let o = 0;

  }

  async function exportAll() {
    if (busy) return;

    // 사진을 여러 묶음(ZIP 파일)으로 나누기
    const groups = []; let g = [], bytes = 0;
    photos.forEach((p) => {
      const sz = (p.blob ? p.blob.size : 0) + (p.thumb ? p.thumb.size : 0);
      if (g.length && (g.length >= EXP_MAX_PHOTOS || bytes + sz > EXP_MAX_BYTES)) { groups.push(g); g = []; bytes = 0; }
      g.push(p); bytes += sz;
    });
    if (g.length) groups.push(g);
    const total = groups.length, base = '가족앨범_전체_' + stamp();
    const fname = (i) => base + '_' + String(i + 1).padStart(2, '0') + 'of' + String(total).padStart(2, '0') + '.zip';
    if (!confirm('사진 ' + photos.length + '장을 ZIP 파일 ' + total + '개로 내보낼까요?\n사진이 많으면 시간이 꽤 걸려요. 끝날 때까지 이 창을 닫지 마세요.')) return;

    let dir = null;   // 크롬·엣지: 폴더를 한 번 고르면 그 안에 모두 저장 / 그 밖의 브라우저: 파일마다 내려받기
    if (window.showDirectoryPicker) {
      try { dir = await (await window.showDirectoryPicker({ mode: 'readwrite' })).getDirectoryHandle(base, { create: true }); }
      catch (e) { if (e.name === 'AbortError') return; dir = null; }
    }
    setBusy(true);
    try {
      let done = 0;
      for (let i = 0; i < total; i++) {
        const files = [], recs = [];
        groups[i].forEach((p) => {
          const d = datesMap[p.id] || {};
          recs.push({ file: 'p/' + p.id + '.jpg', thumb: p.thumb ? 't/' + p.id + '.jpg' : '', album: p.album || '', caption: p.caption || '', note: p.note || '',
            takenAt: p.takenAt, createdAt: p.createdAt || 0,
            date: { source: d.source || 'legacy', fileName: d.fileName || '', fileModified: d.fileModified || 0, uploadedAt: d.uploadedAt || 0, editedAt: d.editedAt || 0 } });
          files.push({ name: 'p/' + p.id + '.jpg', blob: p.blob });
          if (p.thumb) files.push({ name: 't/' + p.id + '.jpg', blob: p.thumb });
        });
        const manifest = { app: 'family-album', version: 1, part: i + 1, parts: total, exportedAt: Date.now(), titles, photos: recs };
        files.unshift({ name: 'manifest.json', blob: new Blob([JSON.stringify(manifest)], { type: 'application/json' }) });
        const zip = await zipStore(files, (n) => bkMsg('내보내는 중… 파일 ' + (i + 1) + ' / ' + total + ' · 사진 ' + Math.min(photos.length, done + Math.floor(n / 2)) + ' / ' + photos.length + '장'));
        done += groups[i].length;
        if (dir) {
          const w = await (await dir.getFileHandle(fname(i), { create: true })).createWritable();
          await w.write(zip); await w.close();
        } else {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(zip); a.download = fname(i); a.click();
          await new Promise((r) => setTimeout(r, 1500));
          setTimeout(() => URL.revokeObjectURL(a.href), 120000);
        }
      }
      bkMsg('완료! ' + (dir ? '고른 폴더 안의 「' + base + '」 폴더에' : '내려받기 폴더에') + ' ZIP 파일 ' + total + '개(사진 ' + photos.length + '장)를 저장했어요. ' +
        '다른 PC에서 「가져오기」를 누르고 이 ZIP 파일들을 한꺼번에 고르면 돼요.');
    } catch (e) {
      bkMsg('내보내는 중 오류가 났어요. 저장 공간이 충분한지 확인하고 다시 시도해 주세요.');
    } finally { setBusy(false); }
  }

  async function importAll(fileList) {
    const files = [...fileList].sort((a, b) => a.name.localeCompare(b.name));
    if (!files.length || busy) return;
    setBusy(true);
    // 이미 있는 사진은 건너뜀 (찍은 시각 + 파일 크기가 같으면 같은 사진으로 봄)
    const have = new Set(photos.map((p) => p.takenAt + '|' + (p.blob ? p.blob.size : 0)));
    let added = 0, skipped = 0, bad = 0, seen = 0, newest = 0;
    const newTitles = {};
    try {
      for (let fi = 0; fi < files.length; fi++) {
        let zip, man;
        try {
          zip = await readZip(files[fi]);
          man = JSON.parse(await zip.get('manifest.json').blob.text());
          if (man.app !== 'family-album') throw new Error('app');
        } catch (e) { bad++; continue; }
        Object.entries(man.titles || {}).forEach(([k, t]) => { if (t && !titles[k]) newTitles[k] = t; });
        const list = man.photos || [];
        for (let i = 0; i < list.length; i += 50) {   // 50장씩 한 번에 저장
          const batch = [];
          list.slice(i, i + 50).forEach((r) => {
            const f = zip.get(r.file); seen++;
            if (!f) return;
            const key = r.takenAt + '|' + f.size;
            if (have.has(key)) { skipped++; return; }
            have.add(key);
            const t = r.thumb && zip.get(r.thumb);
            const blob = new Blob([f.blob], { type: 'image/jpeg' });
            batch.push({
              p: { blob, thumb: t ? new Blob([t.blob], { type: 'image/jpeg' }) : blob, album: r.album || '', caption: r.caption || '', note: r.note || '', takenAt: r.takenAt, createdAt: r.createdAt || Date.now() },
              d: { takenAt: r.takenAt, source: (r.date && r.date.source) || 'legacy', fileName: (r.date && r.date.fileName) || '', fileModified: (r.date && r.date.fileModified) || 0,
                   uploadedAt: (r.date && r.date.uploadedAt) || 0, editedAt: (r.date && r.date.editedAt) || 0 },
            });
          });
          if (batch.length) {
            await txBoth((ps, ds) => { batch.forEach(({ p, d }) => { const rq = ps.add(p); rq.onsuccess = () => ds.put({ ...d, id: rq.result }); }); });
            added += batch.length; batch.forEach(({ p }) => { newest = Math.max(newest, p.takenAt); });
          }
          bkMsg('가져오는 중… 파일 ' + (fi + 1) + ' / ' + files.length + ' · ' + seen + '장 확인 (새로 ' + added + '장)');
        }
      }
      for (const [key, title] of Object.entries(newTitles)) await putMeta({ key, title });
      bkMsg('가져오기 완료! 새 사진 ' + added + '장' + (skipped ? ', 이미 있던 사진 ' + skipped + '장은 건너뜀' : '') +
        (bad ? ', 읽을 수 없는 파일 ' + bad + '개(전체 내보내기로 만든 ZIP이 아니에요)' : '') + '.');
      if (added) { album = ''; query = ''; $('q').value = ''; pageKey = ymKey(newest); photoPage = 0; }
      await load();
    } catch (e) {
      bkMsg('가져오는 중 오류가 났어요. (지금까지 ' + added + '장 저장됨) 저장 공간을 확인하고 같은 파일로 다시 가져오면 이어서 저장돼요.');
      await load().catch(() => {});
    } finally { setBusy(false); $('impFile').value = ''; }
  }
  // 묶음 버튼 열고 닫기 (항목을 누르거나 바깥을 누르면 닫힘)
  const menus = [...document.querySelectorAll('.menu')];
  const closeMenus = (except) => menus.forEach((m) => { if (m !== except) m.querySelector('.mlist').hidden = true; });
  menus.forEach((m) => {
    m.querySelector('.mbtn').onclick = (e) => { e.stopPropagation(); const l = m.querySelector('.mlist'); closeMenus(m); l.hidden = !l.hidden; };
    m.querySelector('.mlist').addEventListener('click', () => closeMenus());
  });
  document.addEventListener('click', (e) => { if (!e.target.closest('.menu')) closeMenus(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenus(); });
  $('expAll').onclick = exportAll;
  $('impAll').onclick = () => { if (!busy) $('impFile').click(); };
  $('impFile').onchange = () => importAll($('impFile').files);
  if (!window.showDirectoryPicker) $('bkDir').hidden = true;

  $('q').addEventListener('input', (e) => { query = e.target.value; photoPage = 0; render(); });

  $('lbNote').addEventListener('input', (e) => { $('lbNoteCnt').textContent = [...e.target.value].length + '/20'; });

  if (!window.indexedDB) {
    $('count').textContent = '이 브라우저는 사진 저장을 지원하지 않아요.';
  } else {
    load().catch(() => { $('count').textContent = '불러오지 못했어요.'; });
  }
})();
  </script>
</body>
